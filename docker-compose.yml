version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - talent-network

  server-1:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - SERVER_ID=server-1
      - REDIS_URL=redis:6379
      - PORT=8080
    ports:
      - "8081:8080"
    depends_on:
      - redis
    networks:
      - talent-network

  server-2:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - SERVER_ID=server-2
      - REDIS_URL=redis:6379
      - PORT=8080
    ports:
      - "8082:8080"
    depends_on:
      - redis
    networks:
      - talent-network

  server-3:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - SERVER_ID=server-3
      - REDIS_URL=redis:6379
      - PORT=8080
    ports:
      - "8083:8080"
    depends_on:
      - redis
    networks:
      - talent-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-1
      - server-2
      - server-3
    networks:
      - talent-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost/ws
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost/ws
      - NEXTAUTH_SECRET=talent-live-dev-secret
    networks:
      - talent-network
    depends_on:
      - nginx

networks:
  talent-network:
    driver: bridge

volumes:
  redis-data:
